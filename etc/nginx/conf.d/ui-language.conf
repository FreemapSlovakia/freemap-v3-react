# Browser language → entry-document language suffix (see `index-<site>-<lang>.html`
# in rspack.config.ts). nginx cannot weigh q-values, so only the first tag of
# Accept-Language is honoured.
#
# The capture is deliberately generic rather than a list of the built languages:
# a tag we do not build simply finds no file and each vhost's try_files falls
# back to that domain's own language, so nginx needs no list to keep in sync.
# Restricting it to two lowercase letters — the form browsers send — is also what
# keeps the value safe to interpolate into a path.
map $http_accept_language $ui_lang {
	default             "";
	~^(?<tag>[a-z]{2})  $tag;
}
