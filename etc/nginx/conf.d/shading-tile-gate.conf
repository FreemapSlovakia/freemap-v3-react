# Premium zooms (16+) of the terrain shadings — parametric (terrain.tiles) and
# detailed (sk-hires-shading.tiles) — are served only to a premium account's
# token with the tiles:shading scope, as outdoor.tiles.freemap.sk does from
# z19. The vhosts include snippets/shading-tile-auth.conf.

# The combined format with a token in the query masked; the vhosts log with it.
map $request $shading_log_request {
        "~^(?<shading_la>.*[?&]token=)[^& ]*(?<shading_lb>.*)$"  "${shading_la}***${shading_lb}";
        default                                                  $request;
}

log_format shading_combined '$remote_addr - $remote_user [$time_local] '
        '"$shading_log_request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

# A cache file holds its key, the token, in plain text, so it lives on tmpfs.
proxy_cache_path /run/nginx-shading-tile-auth levels=1:2
        keys_zone=shading_tile_auth_tmpfs:10m max_size=100m inactive=10m;

map $request_uri $shading_premium_zoom {
        "~^/(?:elevation/|hillshade/)?(?:1[6-9]|2[0-9])/"  1;
        default                                            0;
}

# The quarter the web app shows anyone, (x + 2y) % 4 == 0: x ≡ 0 (mod 4) with an
# even y, or x ≡ 2 with an odd y, read off the last two digits.
map $request_uri $shading_teaser {
        "~^/(?:elevation/|hillshade/)?\d+/(?:(?:\d*[02468])?[048]|\d*[13579][26])/\d*[02468](?:[@.?]|$)"  1;
        "~^/(?:elevation/|hillshade/)?\d+/(?:(?:\d*[02468])?[26]|\d*[13579][048])/\d*[13579](?:[@.?]|$)"  1;
        default  0;
}

# A browser on a Freemap page, on openstreetmap.org (iD), on any other page, or
# no browser. Sec-Fetch-Site can't be dropped or forged by a page, nor a Referer
# faked; www.freemap.eu is cross-site to these hosts, so its Referer tells it.
# A tile opened from the address bar (`none`) counts as an app, so it explains
# itself instead of a bare 403.
map "$http_sec_fetch_site $http_referer" $shading_client {
        default                                                                  foreign;
        "~^(?:none)? "                                                           native;
        "~^(?:same-origin|same-site) "                                           web;
        "~^cross-site https?://(?:[a-z0-9-]+\.)*freemap\.(?:sk|eu)(?::\d+)?/"    web;
        "~^cross-site https://(?:[a-z0-9-]+\.)*openstreetmap\.org/"              osm;
}

# Only the detailed shading and the orthophoto are open to iD at their premium
# zooms.
map $host $shading_osm_allowed {
        sk-hires-shading.tiles.freemap.sk  1;
        ortofoto.tiles.freemap.sk          1;
        default                            0;
}

# Get every zoom: the API's offline-map exporter on fm6 itself, the Freemap
# mobile app until it sends a token — its map (flutter_map) and its elevation
# fetches (Cronet on Android, CFNetwork on iOS) — and JOSM, which is open to
# mappers.
map "$host $remote_addr $http_user_agent" $shading_trusted {
        "~^\S+ (?:127\.0\.0\.1|::1|116\.202\.225\.24|2a01:4f8:241:58aa::2) "  1;
        "~^\S+ \S+ flutter_map \(sk\.bigware\.freemap\)"                       1;
        "~^\S+ \S+ sk\.bigware\.freemap/\d+ \(Linux; .*Cronet/"                1;
        "~^\S+ \S+ [Ff]reemap/\d+ CFNetwork/"                                  1;
        "~^\S+ \S+ JOSM/"                                                      1;
        default                                                                0;
}

map $http_authorization $shading_bearer_token {
        "~*^Bearer\s+(?<shading_bt>\S+)$"  $shading_bt;
        default                            "";
}

map $request_uri $shading_query_token {
        "~[?&]token=(?<shading_qt>[^&#]+)"  $shading_qt;
        default                             "";
}

map $shading_bearer_token $shading_token {
        ""       $shading_query_token;
        default  $shading_bearer_token;
}

# pass, deny, or ask the API. Without a token only the web app's teaser passes.
map "$shading_trusted$shading_premium_zoom:$shading_client:$shading_token:$shading_teaser:$shading_osm_allowed" $shading_gate {
        "~^1"                  pass;
        "~^00:"                pass;
        "~^01:foreign:"        deny;
        "~^01:osm:.*:1$"       pass;
        "~^01:osm:"            deny;
        "~^01:web::1:"         pass;
        "~^01:[a-z]+::"        deny;
        default                check;
}

# The refusal tile's CORS, as each host answers its tiles.
map $host $shading_image_cors_origin {
        sk-hires-shading.tiles.freemap.sk  $cors_skhires;
        default                            "*";
}

# Another site is told to ask us, an app how to add a token.
map $shading_client $shading_premium_zoom_image {
        foreign  premium-zoom.png;
        osm      premium-zoom.png;
        default  premium-zoom-token.png;
}
