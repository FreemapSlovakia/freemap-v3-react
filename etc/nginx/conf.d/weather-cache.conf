# http-level pieces of the weather (LibreWXR) vhost — a cache zone and the
# upstream, neither of which can live in the site file that uses them. Kept
# apart from the sibling proxy-cache.conf (which holds LEGEND) so it is deployed
# and reverted with the vhost it belongs to.
#
# Deployed on fm5, beside the LibreWXR container it points at.

# LibreWXR renders every tile on demand — there is no static pyramid behind it.
# It parallelises well (each render is `asyncio.to_thread` onto a pool of
# cpu_count-1 threads, and the numpy and WebP work releases the GIL), so this
# cache is not there to rescue a serial renderer. It is there because the
# cheapest render is the one not done: an animation is ~430 tiles per user and
# every viewer of the same area asks for identical URLs. The app's own LRU sits
# at zero entries because nothing repeat ever reaches it.
#
# Sized for that job rather than for archiving: entries live five minutes (see
# the vhost's tile location for why they must not live longer), so the working
# set is only what is being watched right now.
proxy_cache_path /fm/data4/nginx-proxy-cache/weather levels=1:1 keys_zone=WEATHER:32m inactive=30m max_size=1g use_temp_path=off;

# The LibreWXR container (docker compose in ~/librewxr, single mode, published
# on loopback only). Pooled, so a cache MISS doesn't pay a new connection.
upstream librewxr {
	server 127.0.0.1:8080;
	keepalive 32;
	keepalive_timeout 60s;
	keepalive_requests 1000;
}
