# auth_request target for the shading hosts; decides by $shading_gate from
# conf.d/shading-tile-gate.conf. Only a token is asked of the API, its answer
# cached a minute; a stale one stands in while the API is unreachable.
location = /_shading-auth {
        internal;

        if ($shading_gate = pass) {
                return 204;
        }

        if ($shading_gate = deny) {
                return 403;
        }

        proxy_pass https://backend.freemap.sk/auth/check?scope=tiles:shading&premium=1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $shading_token";
        proxy_set_header Host backend.freemap.sk;
        proxy_ssl_server_name on;

        proxy_cache shading_tile_auth;
        proxy_cache_key $shading_token;
        proxy_cache_valid 200 401 403 1m;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
}

# A refused premium zoom. The web app keeps the 401 or 403 it handles; the rest
# get an image with 200, as apps like JOSM show no error tile.
location @shading_premium_zoom {
        add_header Access-Control-Allow-Origin $shading_image_cors_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;

        if ($shading_client = web) {
                return 403;
        }

        rewrite ^ /shading-premium-zoom.png last;
}

location = /shading-premium-zoom.png {
        internal;
        # Overrides a server-wide `expires`, which would let an app keep it.
        expires off;
        add_header Access-Control-Allow-Origin $shading_image_cors_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        alias /var/www/shading-$shading_premium_zoom_image;
}
