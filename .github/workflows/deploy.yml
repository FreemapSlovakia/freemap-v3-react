name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys are serialized by the concurrency group above, so a job that hangs
    # blocks every later one until someone kills it. Fail instead.
    timeout-minutes: 15
    env:
      # sentry-cli only honors the token if the URL comes from the same
      # configuration source, so both must be set here in the environment.
      SENTRY_URL: https://sentry.freemap.sk
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # A prebuilt release rather than apt: `apt-get` blocks on the dpkg lock
      # the runner's own unattended-upgrades still holds, with no timeout and
      # no output, and `build:proto` is the only thing that needs protoc.
      - uses: arduino/setup-protoc@v3
        timeout-minutes: 4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: DEPLOYMENT=www pnpm build

      - name: Upload sourcemaps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: pnpm sentry-sourcemaps

      - name: Deploy to fm6
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '21122' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            dist/ "freemap@$DEPLOY_HOST:www/"
