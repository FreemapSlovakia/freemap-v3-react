name: Map library harvest

# Re-probes every catalog map and opens a PR with what changed, so a dead or
# moved server is reviewed rather than found by users. No --reuse-probe: a
# reused answer never notices a map dying.
on:
  schedule:
    # Weekly, Monday, UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    # Probed from Europe, where the users are: European servers refuse GitHub's
    # US runners (and some US ones refuse Europe), which reads as dead maps.
    runs-on: [self-hosted, fm5]
    timeout-minutes: 30
    env:
      BRANCH: harvest/map-library
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      # No `cache: pnpm`: on a self-hosted runner the store is already on the box.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Harvest
        run: node scripts/harvest-eli.mjs --report="$RUNNER_TEMP/report.md"

      - run: pnpm exec biome check --write src/features/mapLibrary/eli

      # One open PR at a time: a new run replaces the branch, and the PR's
      # body follows the latest report.
      - name: Push the branch
        id: push
        run: |
          # probe.json alone changes on most runs: failures are asked again.
          if git diff --quiet -- src/features/mapLibrary/eli/eliCatalog.json src/features/mapLibrary/eli/ids.json; then
            echo "The catalog is unchanged."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add src/features/mapLibrary/eli
          git commit -q -m "chore(map-library): weekly harvest"
          git push -f origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The REST API rather than `gh`, which fm5 doesn't have.
      - name: Open or update the PR
        if: steps.push.outputs.changed == 'true'
        run: |
          node --input-type=module -e '
            const { GITHUB_TOKEN, GITHUB_REPOSITORY, BRANCH, RUNNER_TEMP } = process.env;
            const body = (await import("node:fs")).readFileSync(`${RUNNER_TEMP}/report.md`, "utf8");
            const api = (path, init = {}) =>
              fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}${path}`, {
                ...init,
                headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: "application/vnd.github+json" },
              }).then(async (res) => {
                if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);
                return res.json();
              });
            const owner = GITHUB_REPOSITORY.split("/")[0];
            const [open] = await api(`/pulls?state=open&head=${owner}:${BRANCH}`);
            if (open) {
              await api(`/pulls/${open.number}`, { method: "PATCH", body: JSON.stringify({ body }) });
            } else {
              await api("/pulls", { method: "POST", body: JSON.stringify({ head: BRANCH, base: "main", title: "Map library: weekly harvest", body }) });
            }
          '
