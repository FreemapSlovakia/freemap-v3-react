allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js-pure: true
  deasync: true
  esbuild: true
  exifreader: true
  protobufjs: true

# Reject dependency versions published within the last day (in minutes). Guards
# against a compromised just-published release before the community catches it,
# and keeps local resolution in sync with the GitHub runner's frozen-lockfile
# supply-chain check.
minimumReleaseAge: 1440

# Approved exceptions: freshly-published versions we deliberately accept before
# they age past the cutoff. Keep only entries still younger than a day — once a
# version ages out, its entry is dead clutter and can be dropped. Use at most one
# entry per package (pnpm folds multiple same-name entries into a version union,
# which has mishandled the newest member).
minimumReleaseAgeExclude:
  - react-dropzone@17.0.0
  - tsx@4.23.1
  - '@rspack/dev-server@2.2.0'
  - '@turf/along@7.4.0'
  - '@turf/area@7.4.0'
  - '@turf/bbox-polygon@7.4.0'
  - '@turf/bbox@7.4.0'
  - '@turf/bearing@7.4.0'
  - '@turf/boolean-contains@7.4.0'
  - '@turf/boolean-point-in-polygon@7.4.0'
  - '@turf/boolean-point-on-line@7.4.0'
  - '@turf/buffer@7.4.0'
  - '@turf/center@7.4.0'
  - '@turf/clean-coords@7.4.0'
  - '@turf/clone@7.4.0'
  - '@turf/destination@7.4.0'
  - '@turf/distance@7.4.0'
  - '@turf/flatten@7.4.0'
  - '@turf/geojson-rbush@7.4.0'
  - '@turf/helpers@7.4.0'
  - '@turf/invariant@7.4.0'
  - '@turf/length@7.4.0'
  - '@turf/line-intersect@7.4.0'
  - '@turf/line-segment@7.4.0'
  - '@turf/line-split@7.4.0'
  - '@turf/meta@7.4.0'
  - '@turf/nearest-point-on-line@7.4.0'
  - '@turf/projection@7.4.0'
  - '@turf/simplify@7.4.0'
  - '@turf/truncate@7.4.0'
  - tsx@4.23.5
