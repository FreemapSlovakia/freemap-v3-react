  <defs id="defs2">
    <filter id="filter2298" style="color-interpolation-filters:sRGB" x="-0.070872687" y="-0.097423868" width="1.1616401" height="1.2222736">
      <feFlood id="feFlood2288" result="flood" flood-color="rgb(0,0,0)" flood-opacity="0.498039" />
      <feComposite id="feComposite2290" result="composite1" operator="in" in2="SourceGraphic" in="flood" />
      <feGaussianBlur id="feGaussianBlur2292" result="blur" stdDeviation="0.4" in="composite1" />
      <feOffset id="feOffset2294" result="offset" dy="0.3" dx="0.3" />
      <feComposite id="feComposite2296" result="composite2" operator="over" in2="offset" in="SourceGraphic" />
    </filter>
    <!-- Petal shading, in the flower group's own coordinates: bright near the shared
         centre, deeper at the tips, mirroring the raster original. -->
    <radialGradient id="petalGreen" gradientUnits="userSpaceOnUse" cx="146" cy="72" r="78" fx="120" fy="42">
      <stop offset="0" stop-color="#ddf5c0" id="stop1" />
      <stop offset="0.42" stop-color="#bbdd8e" id="stop2" />
      <stop offset="1" stop-color="#7a9156" id="stop3" />
    </radialGradient>
    <radialGradient id="petalRed" gradientUnits="userSpaceOnUse" cx="146" cy="72" r="78" fx="120" fy="42">
      <stop offset="0" stop-color="#ff9a80" id="stop4" />
      <stop offset="0.42" stop-color="#d01414" id="stop5" />
      <stop offset="1" stop-color="#8a0505" id="stop6" />
    </radialGradient>
    <radialGradient id="petalAmber" gradientUnits="userSpaceOnUse" cx="146" cy="72" r="78" fx="120" fy="42">
      <stop offset="0" stop-color="#ffdf9b" id="stop7" />
      <stop offset="0.42" stop-color="#e8a01e" id="stop8" />
      <stop offset="1" stop-color="#b06a00" id="stop9" />
    </radialGradient>
    <!-- Specular sheen laid over each flower, light from the upper left. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="100" y1="25" x2="175" y2="115">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7" id="stop10" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.16" id="stop11" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0" id="stop12" />
    </linearGradient>
  </defs>
