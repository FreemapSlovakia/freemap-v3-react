<svg xmlns="http://www.w3.org/2000/svg" id="svg8" viewBox="33.6 0.2 17.735294 13.4">
  <defs id="defs2">
    <!-- Petal shading in the flower's own coordinates: bright near the shared
         centre, deeper at the tips, mirroring the raster original. -->
    <radialGradient id="petalGreen" cx="146" cy="72" r="78" fx="120" fy="42" gradientUnits="userSpaceOnUse">
      <stop id="stop1" offset="0" stop-color="#ddf5c0"/>
      <stop id="stop2" offset=".42" stop-color="#bbdd8e"/>
      <stop id="stop3" offset="1" stop-color="#7a9156"/>
    </radialGradient>
    <radialGradient id="petalRed" cx="146" cy="72" r="78" fx="120" fy="42" gradientUnits="userSpaceOnUse">
      <stop id="stop4" offset="0" stop-color="#ff9a80"/>
      <stop id="stop5" offset=".42" stop-color="#d01414"/>
      <stop id="stop6" offset="1" stop-color="#8a0505"/>
    </radialGradient>
    <radialGradient id="petalAmber" cx="146" cy="72" r="78" fx="120" fy="42" gradientUnits="userSpaceOnUse">
      <stop id="stop7" offset="0" stop-color="#ffdf9b"/>
      <stop id="stop8" offset=".42" stop-color="#e8a01e"/>
      <stop id="stop9" offset="1" stop-color="#b06a00"/>
    </radialGradient>
    <!-- Specular sheen laid over each flower, light from the upper left. -->
    <linearGradient id="sheen" x1="100" x2="175" y1="25" y2="115" gradientUnits="userSpaceOnUse">
      <stop id="stop10" offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop id="stop11" offset=".35" stop-color="#fff" stop-opacity=".16"/>
      <stop id="stop12" offset=".62" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="filter2298" width="1.16164" height="1.222274" x="-.070873" y="-.097424" style="color-interpolation-filters:sRGB">
      <feFlood id="feFlood2288" flood-color="#000" flood-opacity=".498039" result="flood"/>
      <feComposite id="feComposite2290" in="flood" in2="SourceGraphic" operator="in" result="composite1"/>
      <feGaussianBlur id="feGaussianBlur2292" in="composite1" result="blur" stdDeviation=".4"/>
      <feOffset id="feOffset2294" dx=".3" dy=".3" result="offset"/>
      <feComposite id="feComposite2296" in="SourceGraphic" in2="offset" operator="over" result="composite2"/>
    </filter>
  </defs>
